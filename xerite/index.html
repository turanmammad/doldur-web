body{margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
a{text-decoration:none}
:focus-visible{outline:2px solid #12E28C;outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.dn-scroll{scrollbar-width:none}
.dn-scroll::-webkit-scrollbar{display:none}
@keyframes dPulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes dIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:960px){.d-aside{max-height:calc(100vh - 104px);overflow:auto;padding-right:4px}}
@media (max-width:959px){.d-map{order:-1;height:420px!important;min-height:420px!important;max-height:none!important}.d-hide-t{display:none!important}}
@media (max-width:900px){.d-nav{order:3;flex-basis:100%!important}}
@media (max-width:720px){.d-h1{font-size:30px!important}.d-hide-m{display:none!important}.d-map{height:380px!important;min-height:380px!important}.d-th{display:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* Xəritə markerləri: aşağı zumda pin əvəzinə rəngli nöqtə (563 pin üst-üstə düşməsin) */
.dm-dot{display:none;width:12px;height:12px;border-radius:999px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.dm-low .dm-pin .dm-head,.dm-low .dm-pin .dm-stem{display:none!important}
.dm-low .dm-pin .dm-dot{display:block}
.dm-low .dm-pin.dm-on .dm-head,.dm-low .dm-pin.dm-on .dm-stem{display:flex!important}
.dm-low .dm-pin.dm-on .dm-stem{display:block!important}
.dm-low .dm-pin.dm-on .dm-dot{display:none}
.maplibregl-canvas:focus-visible{outline:none}
